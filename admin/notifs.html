<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirim Notifikasi Global — Pinjam.in</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/1transparant.svg">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/core/guard.js" data-roles="Admin"></script>
  <script src="../assets/js/core/theme.js"></script>
  <style>
    .type-button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    .type-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      padding: 0.875rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--c-border);
      background: var(--c-surface);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--c-ink);
      transition: all 150ms ease;
    }
    .type-btn:hover {
      background: var(--c-surface-muted);
    }
    .type-btn.is-active {
      border-color: var(--c-primary);
      background: color-mix(in srgb, var(--c-primary) 10%, var(--c-surface));
      color: var(--c-primary-pressed);
    }
    .broadcast-card {
      padding: 1.25rem;
      border-bottom: 1px solid var(--c-border);
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }
    .broadcast-card:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="mesh"><div class="mesh-color"></div><div class="mesh-dim"></div></div>

  <div class="app-shell">
    <div id="shell-sidebar"></div>

    <div class="app-main">
      <header class="top-header-mobile" id="shell-topbar-mobile"></header>
      <header class="top-header-desktop" id="shell-topbar-desktop"></header>

      <main class="content-body">
        <div style="margin-bottom: 1.5rem;">
          <h1 class="page-title">Kirim Notifikasi</h1>
          <p class="page-subtitle">Siarkan pengumuman atau peringatan penting langsung ke pengguna aplikasi.</p>
        </div>

        <div class="grid-split" style="--split: minmax(0, 1fr) minmax(0, 1.1fr);">
          
          <!-- Broadcast Form -->
          <div class="card" style="padding: 1.5rem;">
            <h2 style="font-size: 1.125rem; font-weight: 600; color: var(--c-ink); margin-bottom: 1.25rem;">
              Buat Notifikasi Baru
            </h2>

            <form id="broadcast-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
              <div class="field">
                <label class="field-label">Tipe Notifikasi</label>
                <div class="type-button-grid" id="type-selector">
                  <button type="button" class="type-btn" data-type="Peringatan">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--c-danger);"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></svg>
                    <span>Peringatan</span>
                  </button>
                  <button type="button" class="type-btn" data-type="Pesan">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--c-primary);"><path d="M3 6h18v12H3zM3 7l9 6 9-6"/></svg>
                    <span>Pesan</span>
                  </button>
                  <button type="button" class="type-btn is-active" data-type="Info">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--c-ink-2);"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5M12 8h.01"/></svg>
                    <span>Info</span>
                  </button>
                </div>
                <p style="font-size: 0.75rem; color: var(--c-ink-2); margin-top: 0.375rem;" id="type-description">
                  Informasi umum seputar fasilitas atau layanan.
                </p>
              </div>

              <div class="field">
                <label class="field-label" for="bc-title">Judul Pengumuman</label>
                <input type="text" id="bc-title" class="input" placeholder="Contoh: Pemeliharaan Server Akhir Pekan" required minlength="3">
              </div>

              <div class="field">
                <label class="field-label" for="bc-message">Isi Pesan</label>
                <textarea id="bc-message" class="input" rows="4" placeholder="Tuliskan isi pengumuman atau instruksi secara jelas…" required minlength="3" style="resize: vertical;"></textarea>
              </div>

              <div class="field">
                <label class="field-label">Target Penerima</label>
                <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap;">
                  <button type="button" class="chip is-active" data-target="semua">Semua Pengguna</button>
                  <button type="button" class="chip" data-target="Mahasiswa">Mahasiswa Saja</button>
                  <button type="button" class="chip" data-target="Dosen">Dosen Saja</button>
                  <button type="button" class="chip" data-target="pilih">Pilih Pengguna Tertentu</button>
                </div>

                <!-- Specific user selector (hidden by default) -->
                <div id="specific-users-box" style="display: none; padding: 0.75rem; background: var(--c-surface-muted); border-radius: var(--radius-lg); border: 1px solid var(--c-border); max-height: 180px; overflow-y: auto;">
                  <input type="text" id="search-target-user" class="input" placeholder="Saring nama pengguna…" style="margin-bottom: 0.5rem; padding: 0.375rem 0.625rem; font-size: 0.8125rem;">
                  <div id="users-checkboxes" style="display: flex; flex-direction: column; gap: 0.375rem;"></div>
                </div>
              </div>

              <button type="submit" class="btn btn-primary" id="send-broadcast-btn" style="margin-top: 0.5rem;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
                <span id="send-btn-text">Siarkan Notifikasi</span>
              </button>
            </form>
          </div>

          <!-- Broadcast History -->
          <div class="card" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">
            <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--c-border); display: flex; align-items: center; justify-content: space-between;">
              <h2 style="font-size: 1.125rem; font-weight: 600; color: var(--c-ink);">Riwayat Siaran</h2>
              <button type="button" class="icon-btn icon-btn-sm" id="refresh-broadcasts-btn" title="Segarkan">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
              </button>
            </div>
            
            <div style="flex: 1; overflow-y: auto; max-height: 600px;" id="broadcasts-list-container">
              <div id="broadcasts-loading" style="padding: 3rem 1.5rem; text-align: center; color: var(--c-ink-2);">
                <div class="spinner" style="margin: 0 auto 0.5rem auto;"></div>
                <p style="font-size: 0.875rem;">Memuat riwayat…</p>
              </div>
              <div id="broadcasts-empty" style="display: none; padding: 4rem 1.5rem; text-align: center; color: var(--c-ink-2);">
                <p>Belum ada notifikasi broadcast yang dikirim.</p>
              </div>
              <div id="broadcasts-items"></div>
            </div>
          </div>

        </div>
      </main>
    </div>

    <div id="shell-bottombar-mobile"></div>
  </div>

  <script type="module" src="../assets/js/admin/notifs.js"></script>
</body>
</html>
