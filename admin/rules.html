<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Aturan — Pinjam.in</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/1transparant.svg">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/core/guard.js" data-roles="Admin"></script>
  <script src="../assets/js/core/theme.js"></script>
  <style>
    .rule-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--c-border);
      flex-wrap: wrap;
    }
    .rule-item:last-child {
      border-bottom: none;
    }
    .stepper-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem;
      border-radius: var(--radius-full);
      background: var(--c-surface-muted);
      border: 1px solid var(--c-border);
    }
    .step-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--c-ink);
      transition: all 150ms ease;
    }
    .step-btn:hover:not(:disabled) {
      background: color-mix(in srgb, var(--c-primary) 10%, var(--c-surface));
      border-color: var(--c-primary);
    }
    .step-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .step-value-box {
      width: 68px;
      text-align: center;
    }
    .step-num {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--c-ink);
    }
    .step-unit {
      font-size: 0.75rem;
      color: var(--c-ink-2);
    }
  </style>
</head>
<body>
  <div class="mesh"><div class="mesh-color"></div><div class="mesh-dim"></div></div>

  <div class="app-shell">
    <div id="shell-sidebar"></div>

    <div class="app-main">
      <header class="top-header-mobile" id="shell-topbar-mobile"></header>
      <header class="top-header-desktop" id="shell-topbar-desktop"></header>

      <main class="content-body">
        <div style="margin-bottom: 1.5rem;">
          <h1 class="page-title">Pengaturan Aturan</h1>
          <p class="page-subtitle">Ubah batas operasional peminjaman barang. Berlaku langsung untuk pengajuan booking baru.</p>
        </div>

        <div class="grid-split" style="--split: minmax(0, 1fr) 320px;">
          
          <!-- Rules Stepper Card -->
          <div class="card" style="padding: 0; overflow: hidden;">
            <div id="rules-list"></div>

            <div style="padding: 1.25rem 1.5rem; background: var(--c-surface-muted); border-top: 1px solid var(--c-border); display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;">
              <div style="display: flex; gap: 0.5rem;">
                <button type="button" class="btn btn-primary" id="save-rules-btn" disabled>
                  Simpan Perubahan
                </button>
                <button type="button" class="btn btn-ghost" id="cancel-rules-btn" disabled>
                  Batal
                </button>
              </div>
              <button type="button" class="btn btn-secondary btn-sm" id="reset-default-btn">
                Kembalikan Default
              </button>
            </div>
          </div>

          <!-- Preview & Rules Explanation Sidebar -->
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="card" style="padding: 1.25rem;">
              <h3 style="font-size: 0.9375rem; font-weight: 600; color: var(--c-primary); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.375rem;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
                <span>Pratinjau untuk Pengguna</span>
              </h3>
              <ul id="rules-preview-list" style="margin: 0; padding-left: 1.25rem; font-size: 0.8125rem; color: var(--c-ink-2); line-height: 1.6; display: flex; flex-direction: column; gap: 0.5rem;">
              </ul>
            </div>

            <div class="card" style="padding: 1.25rem; font-size: 0.8125rem; color: var(--c-ink-2); line-height: 1.5;">
              <p style="font-weight: 600; color: var(--c-ink); margin-bottom: 0.375rem;">Catatan Pengelola:</p>
              Perubahan aturan langsung tersimpan di server Supabase dan memvalidasi setiap pemesanan di sisi server secara real-time.
            </div>
          </div>

        </div>
      </main>
    </div>

    <div id="shell-bottombar-mobile"></div>
  </div>

  <script type="module" src="../assets/js/admin/rules.js"></script>
</body>
</html>
