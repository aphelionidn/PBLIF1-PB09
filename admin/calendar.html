<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender Ketersediaan — Pinjam.in</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/1transparant.svg">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/core/guard.js" data-roles="Admin"></script>
  <script src="../assets/js/core/theme.js"></script>
  <style>
    .cal-cell {
      width: 100%;
      height: 44px;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 0.8125rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--c-border);
      cursor: pointer;
      transition: all 150ms ease;
    }
    .cal-cell:hover {
      filter: brightness(0.95);
      transform: scale(0.98);
    }
    .heat-empty {
      background: var(--c-surface-muted);
      color: var(--c-ink-2);
    }
    .heat-low {
      background: var(--c-tint-blue);
      color: var(--c-primary-pressed);
    }
    .heat-mid {
      background: var(--c-tint-orange);
      color: var(--c-warning);
    }
    .heat-full {
      background: var(--c-tint-red);
      color: var(--c-danger);
    }
  </style>
</head>
<body>
  <div class="mesh"><div class="mesh-color"></div><div class="mesh-dim"></div></div>

  <div class="app-shell">
    <div id="shell-sidebar"></div>

    <div class="app-main">
      <header class="top-header-mobile" id="shell-topbar-mobile"></header>
      <header class="top-header-desktop" id="shell-topbar-desktop"></header>

      <main class="content-body">
        <!-- Header & Nav controls -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem;">
          <div>
            <h1 class="page-title">Kalender Ketersediaan</h1>
            <p class="page-subtitle">Unit terpakai / total per barang selama 14 hari ke depan. Klik sel untuk melihat peminjam.</p>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <button type="button" class="icon-btn" id="prev-week-btn" title="Minggu Sebelumnya">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button type="button" class="btn btn-secondary btn-sm" id="today-btn">
              Hari Ini
            </button>
            <button type="button" class="icon-btn" id="next-week-btn" title="Minggu Berikutnya">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>

        <p id="calendar-range-title" style="font-size: 1.0625rem; font-weight: 700; color: var(--c-ink); margin-bottom: 0.75rem;">
          Memuat kalender…
        </p>

        <!-- Calendar Grid Card -->
        <div class="card" style="padding: 0.75rem; overflow-x: auto; margin-bottom: 1rem;">
          <table style="width: 100%; border-separate: separate; border-spacing: 4px; min-width: 900px;" id="calendar-table">
            <thead id="calendar-thead"></thead>
            <tbody id="calendar-tbody"></tbody>
          </table>
        </div>

        <!-- Legend -->
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; font-size: 0.8125rem; color: var(--c-ink-2);">
          <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
            <span style="display: flex; align-items: center; gap: 0.375rem;">
              <span style="width: 14px; height: 14px; border-radius: 4px; background: var(--c-surface-muted); border: 1px solid var(--c-border);"></span>
              <span>Kosong</span>
            </span>
            <span style="display: flex; align-items: center; gap: 0.375rem;">
              <span style="width: 14px; height: 14px; border-radius: 4px; background: var(--c-tint-blue); border: 1px solid var(--c-border);"></span>
              <span>Sebagian</span>
            </span>
            <span style="display: flex; align-items: center; gap: 0.375rem;">
              <span style="width: 14px; height: 14px; border-radius: 4px; background: var(--c-tint-orange); border: 1px solid var(--c-border);"></span>
              <span>≥ 50% terpakai</span>
            </span>
            <span style="display: flex; align-items: center; gap: 0.375rem;">
              <span style="width: 14px; height: 14px; border-radius: 4px; background: var(--c-tint-red); border: 1px solid var(--c-border);"></span>
              <span>Penuh</span>
            </span>
          </div>
          <div>Termasuk status Disetujui, Dipinjam, & Terlambat.</div>
        </div>

      </main>
    </div>

    <div id="shell-bottombar-mobile"></div>
  </div>

  <!-- Day Inspection Modal -->
  <div class="modal-backdrop" id="cal-detail-modal">
    <div class="modal-content" style="max-width: 480px;">
      <div class="modal-header">
        <h3 class="modal-title" id="cal-detail-title">Detail Peminjaman</h3>
        <button type="button" class="icon-btn icon-btn-sm" id="close-cal-modal-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body" style="max-height: 400px; overflow-y: auto;">
        <div id="cal-detail-list" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="ok-cal-modal-btn">Tutup</button>
      </div>
    </div>
  </div>

  <script type="module" src="../assets/js/admin/calendar.js"></script>
</body>
</html>
