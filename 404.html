<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Halaman Tidak Ditemukan | Pinjam.in</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/1transparant.svg">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <script src="/assets/js/core/theme.js"></script>
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: var(--c-bg);
      color: var(--c-text);
    }
    .error-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-2xl);
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--c-primary), #0ea5e9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--c-text);
      margin: 0 0 0.75rem 0;
    }
    .error-desc {
      font-size: 0.9375rem;
      color: var(--c-text-muted);
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      background: var(--c-primary);
      color: #fff;
      font-weight: 600;
      border-radius: var(--radius-lg);
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .brand-header {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      margin-bottom: 2rem;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .brand-name {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--c-text);
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="error-wrapper">
    <div class="error-card">
      <div class="brand-header">
        <img src="/assets/img/1transparant.svg" alt="Pinjam.in Logo" class="brand-logo">
        <span class="brand-name">Pinjam.in</span>
      </div>
      <div class="error-code">404</div>
      <h1 class="error-title">Halaman Tidak Ditemukan</h1>
      <p class="error-desc">Maaf, tautan atau halaman yang kamu tuju tidak tersedia atau telah dipindahkan.</p>
      <a href="/" class="btn-home">
        <span>← Kembali ke Beranda</span>
      </a>
    </div>
  </div>
</body>
</html>
