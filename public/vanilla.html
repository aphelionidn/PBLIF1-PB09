<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinjam.in — Memuat…</title>
  <link rel="icon" type="image/svg+xml" href="1transparant.svg">
  <script>
    (function() {
      try {
        var user = JSON.parse(localStorage.getItem('pinjamin.user') || 'null');
        var token = localStorage.getItem('pinjamin.token');
        if (user && token) {
          if (user.role === 'Admin') {
            window.location.replace('admin-items.html');
          } else {
            window.location.replace('catalog.html');
          }
        } else {
          window.location.replace('login.html');
        }
      } catch (e) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body style="font-family: sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #F6F7F9; color: #1C1C1E;">
  <p>Memuat Pinjam.in…</p>
</body>
</html>
