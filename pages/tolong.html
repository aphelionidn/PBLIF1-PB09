<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tolong.in (Pusat Bantuan) — Pinjam.in</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/1transparant.svg">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/core/guard.js"></script>
  <script src="../assets/js/core/theme.js"></script>
  <style>
    .tolong-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      height: calc(100vh - 160px);
      min-height: 520px;
    }
    @media (min-width: 1024px) {
      .tolong-layout {
        grid-template-columns: 340px 1fr;
      }
    }
    .ticket-list-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .ticket-item {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--c-border);
      text-align: left;
      background: transparent;
      cursor: pointer;
      width: 100%;
      transition: background 150ms ease;
    }
    .ticket-item:last-child {
      border-bottom: none;
    }
    .ticket-item:hover {
      background-color: var(--c-surface-muted);
    }
    .ticket-item.is-selected {
      background-color: color-mix(in srgb, var(--c-primary) 10%, var(--c-surface));
      border-left: 3px solid var(--c-primary);
    }
    .chat-view-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .chat-messages-box {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }
    .msg-bubble {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-xl);
      font-size: 0.9375rem;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg-mine {
      align-self: flex-end;
      background-color: var(--c-primary);
      color: var(--c-on);
      border-bottom-right-radius: var(--radius-xs);
    }
    .msg-other {
      align-self: flex-start;
      background-color: var(--c-surface-muted);
      color: var(--c-ink);
      border: 1px solid var(--c-border);
      border-bottom-left-radius: var(--radius-xs);
    }
  </style>
</head>
<body>
  <div class="mesh"><div class="mesh-color"></div><div class="mesh-dim"></div></div>

  <div class="app-shell">
    <div id="shell-sidebar"></div>

    <div class="app-main">
      <header class="top-header-mobile" id="shell-topbar-mobile"></header>
      <header class="top-header-desktop" id="shell-topbar-desktop"></header>

      <main class="content-body" style="padding-bottom: 1.5rem;">
        <!-- Header -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem;">
          <div>
            <h1 class="page-title">Tolong.in</h1>
            <p class="page-subtitle" id="tolong-subtitle">Pusat bantuan & percakapan langsung dengan Admin.</p>
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="new-ticket-btn" style="display: none;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
            <span>Buat Tiket Baru</span>
          </button>
        </div>

        <div class="tolong-layout">
          <!-- Left: Tickets List Panel -->
          <div class="card ticket-list-panel" id="tickets-panel">
            <div style="padding: 1rem; border-bottom: 1px solid var(--c-border); display: flex; flex-direction: column; gap: 0.75rem;">
              <div class="search-box">
                <span class="search-box-icon">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg>
                </span>
                <input type="text" id="ticket-search" class="input search-box-input" placeholder="Cari subjek, pesan, nama…">
              </div>
              <div class="chips-container" id="ticket-filters">
                <button type="button" class="chip is-active" data-status="semua">Semua</button>
                <button type="button" class="chip" data-status="Terbuka">Terbuka</button>
                <button type="button" class="chip" data-status="Selesai">Selesai</button>
              </div>
            </div>

            <div style="flex: 1; overflow-y: auto;" id="tickets-container">
              <div id="tickets-loading" style="padding: 2.5rem 1rem; text-align: center; color: var(--c-ink-2);">
                <div class="spinner" style="margin: 0 auto 0.5rem auto;"></div>
                <p style="font-size: 0.875rem;">Memuat tiket…</p>
              </div>
              <div id="tickets-empty" style="display: none; padding: 3rem 1rem; text-align: center; color: var(--c-ink-2);">
                <p style="font-size: 0.875rem;">Belum ada tiket bantuan.</p>
              </div>
              <div id="tickets-list"></div>
            </div>
          </div>

          <!-- Right: Chat Message View -->
          <div class="card chat-view-panel" id="chat-panel">
            <div id="chat-empty-state" style="margin: auto; text-align: center; padding: 2rem; color: var(--c-ink-2);">
              <div class="brand-icon-box" style="margin: 0 auto 1rem auto; width: 48px; height: 48px;">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18v12H3zM3 7l9 6 9-6"/></svg>
              </div>
              <h3 style="font-size: 1.125rem; font-weight: 600; color: var(--c-ink);" id="empty-title">Pilih salah satu tiket</h3>
              <p style="margin-top: 0.25rem; font-size: 0.875rem;" id="empty-desc">Pilih tiket di panel kiri untuk membuka percakapan.</p>
            </div>

            <!-- Active Ticket Detail Box -->
            <div id="active-chat-content" style="display: none; flex-direction: column; height: 100%;">
              <!-- Chat Header -->
              <div style="padding: 0.875rem 1.25rem; border-bottom: 1px solid var(--c-border); display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;">
                <div style="min-width: 0;">
                  <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <button type="button" class="btn btn-secondary btn-sm hide-lg" id="back-to-tickets-btn" style="padding: 0.25rem 0.5rem;">
                      ← Kembali
                    </button>
                    <span class="pill" id="ticket-status-pill">Terbuka</span>
                    <span style="font-size: 0.8125rem; color: var(--c-ink-2);" id="ticket-author-info"></span>
                  </div>
                  <h2 style="margin-top: 0.375rem; font-size: 1.0625rem; font-weight: 700; color: var(--c-ink);" id="ticket-subject-title">Subjek Tiket</h2>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" id="toggle-status-btn">
                  Tandai Selesai
                </button>
              </div>

              <!-- Message Stream -->
              <div class="chat-messages-box" id="messages-stream"></div>

              <!-- Chat Input Bar -->
              <div style="padding: 0.875rem 1.25rem; border-top: 1px solid var(--c-border); display: flex; gap: 0.5rem; align-items: flex-end; background: var(--c-surface);">
                <textarea id="chat-input" class="input" rows="1" placeholder="Tulis balasan… (Enter untuk mengirim)" style="resize: none; max-height: 120px; line-height: 1.4; padding: 0.625rem 0.875rem;"></textarea>
                <button type="button" class="btn btn-primary" id="send-msg-btn" style="flex-shrink: 0; padding: 0.625rem 1.125rem;">
                  <span>Kirim</span>
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="shell-bottombar-mobile"></div>
  </div>

  <!-- Modal Buat Tiket Baru -->
  <div class="modal-backdrop" id="new-ticket-modal">
    <div class="modal-content" style="max-width: 480px;">
      <div class="modal-header">
        <h3 class="modal-title">Buat Tiket Bantuan</h3>
        <button type="button" class="icon-btn icon-btn-sm" id="close-new-modal-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <form id="new-ticket-form">
        <div class="modal-body" style="display: flex; flex-direction: column; gap: 1rem;">
          <div class="field">
            <label class="field-label" for="ticket-subject-input">Subjek Masalah</label>
            <input type="text" id="ticket-subject-input" class="input" placeholder="Contoh: Kabel HDMI rusak di R.301" required>
          </div>
          <div class="field">
            <label class="field-label" for="ticket-msg-input">Pesan / Penjelasan Detail</label>
            <textarea id="ticket-msg-input" class="input" rows="4" placeholder="Jelaskan kebutuhan atau kendala yang kamu hadapi…" required style="resize: vertical;"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-new-modal-btn">Batal</button>
          <button type="submit" class="btn btn-primary" id="submit-ticket-btn">Kirim Tiket</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../assets/js/pages/tolong.js"></script>
</body>
</html>
